<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutravoe scratch card</title>
<meta name="description" content="Scratch the card to see what you’ve won from Nutravoe.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nutravoe">
<meta property="og:title" content="You’ve got a Nutravoe scratch card!">
<meta property="og:description" content="Scratch it to see what you’ve won.">
<meta property="og:url" content="https://nutravoe.in/scratch">
<meta property="og:image" content="https://nutravoe.in/scratch/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, warm, a little treat from a fresh-bowl kitchen.
   IDEA: a real scratch card handed over with an order: berry foil over a sunny reward.
   PICTURE: the card itself, large and centred; foil you scratch with finger or mouse.
   COLOUR and TYPE: berry magenta foil, mango yellow reward, cream ground; Fredoka + Nunito.
   LAYOUT: one object on one screen, a short line above, a reset below. */
:root{color-scheme:light dark;--bg:light-dark(#fff6ea,#1d0f18);--ink:light-dark(#3a1630,#fbe9f1);--muted:light-dark(#7a5a6e,#c9a9bb);--berry:#b5175e;--berry2:#7d1048;--mango:#ffc23d;--mango2:#ff9f1c;--leaf:#2f9e5b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;display:grid;place-items:center;overflow-x:clip}
main{width:min(440px,100%);padding:28px 18px 36px;text-align:center}
h1{font:700 30px/1.1 Fredoka,system-ui,sans-serif;margin:0 0 6px;text-wrap:balance}
.lead{margin:0 0 22px;color:var(--muted)}
.card{position:relative;aspect-ratio:4/3;border-radius:24px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(125,16,72,.55),0 2px 0 rgba(0,0,0,.04);user-select:none;-webkit-user-select:none;touch-action:none}
.prize{position:absolute;inset:0;display:grid;place-content:center;gap:2px;background:radial-gradient(120% 90% at 50% 30%,#fff3c4 0,var(--mango) 55%,var(--mango2) 100%);color:#5a1235}
.prize .won{font:600 20px/1 Fredoka,sans-serif;letter-spacing:.01em}
.prize .amt{font:700 clamp(84px,30vw,128px)/1 Fredoka,sans-serif;color:var(--berry2);text-shadow:0 3px 0 rgba(255,255,255,.55)}
.prize .sub{font:700 15px/1.3 Nunito,sans-serif;opacity:.85}
.prize svg{position:absolute;pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;transition:opacity .6s ease}
canvas.gone{opacity:0;pointer-events:none}
.hint{margin:16px 0 0;color:var(--muted);font-size:14px;min-height:21px}
button{margin-top:14px;font:700 16px Nunito,sans-serif;color:#fff;background:var(--berry);border:0;border-radius:999px;padding:12px 26px;min-height:44px;cursor:pointer}
button:focus-visible{outline:3px solid var(--mango);outline-offset:3px}
button[hidden]{display:none}
.brand{display:inline-block;margin-bottom:14px}.brand img{display:block;height:30px;width:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .brand img{filter:invert(1)}}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}.acts button{margin:0}
.wa{display:inline-flex;align-items:center;font:700 16px Nunito,sans-serif;color:#fff;background:#1fa855;border-radius:999px;padding:12px 24px;min-height:44px;text-decoration:none}
.wa:focus-visible{outline:3px solid var(--mango);outline-offset:3px}
.order{margin:18px 0 0;font-size:14px}.order a{color:var(--berry);font-weight:700}
.burst i{position:absolute;width:9px;height:14px;border-radius:2px;top:50%;left:50%;opacity:0;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){canvas{transition:none}.burst{display:none}}
</style>
</head>
<body>
<main>
  <a class="brand" href="https://nutravoe.in"><img src="/scratch/wordmark.png" alt="Nutravoe" height="30"></a>
  <h1>A little treat from Nutravoe</h1>
  <p class="lead">Scratch the card to see what you’ve won.</p>
  <div class="card" id="card">
    <div class="prize" aria-live="polite">
      <svg viewBox="0 0 400 300" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g opacity=".5">
          <circle cx="40" cy="44" r="16" fill="#ff6b9a"/><circle cx="58" cy="36" r="10" fill="#ff6b9a"/>
          <path d="M350 40c18 0 30 14 30 30s-12 28-30 28-30-12-30-28 12-30 30-30z" fill="#2f9e5b" opacity=".55"/>
          <circle cx="360" cy="250" r="20" fill="#b5175e" opacity=".5"/><circle cx="335" cy="262" r="11" fill="#b5175e" opacity=".5"/>
          <circle cx="54" cy="252" r="22" fill="#fff" opacity=".6"/><circle cx="54" cy="252" r="8" fill="#ffc23d"/>
        </g>
      </svg>
      <span class="won">You won</span>
      <span class="amt">₹10</span>
      <div class="burst" id="burst"></div>
    </div>
    <canvas id="foil" aria-label="Scratch card. Drag across it to scratch." role="img"></canvas>
  </div>
  <p class="hint" id="hint">Drag your finger or mouse across the card.</p>
  <div class="acts">
    <a class="wa" id="wa" href="https://wa.me/?text=I%20got%20a%20Nutravoe%20scratch%20card!%20Scratch%20yours%3A%20https%3A%2F%2Fnutravoe.in%2Fscratch">Share on WhatsApp</a>
    <button id="again" hidden>Scratch a new card</button>
  </div>
  <p class="order"><a href="https://nutravoe.in">Order from nutravoe.in</a></p>
</main>
<script>
{
  const cv = document.getElementById('foil'), card = document.getElementById('card');
  const hint = document.getElementById('hint'), again = document.getElementById('again'), burst = document.getElementById('burst');
  const ctx = cv.getContext('2d', {willReadFrequently: true});
  let dpr = 1, down = false, last = null, done = false, checks = 0;

  function paintFoil() {
    const r = card.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    const W = cv.width, H = cv.height;
    ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#d12a74'); g.addColorStop(.5, '#b5175e'); g.addColorStop(1, '#7d1048');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // foil sheen
    const s = ctx.createLinearGradient(0, 0, W, 0);
    s.addColorStop(0, 'rgba(255,255,255,0)'); s.addColorStop(.45, 'rgba(255,255,255,.18)'); s.addColorStop(.55, 'rgba(255,255,255,0)');
    ctx.fillStyle = s; ctx.fillRect(0, 0, W, H);
    // berry dots
    const u = W / 400;
    for (let y = 18; y < 300; y += 34) for (let x = (y / 34) % 2 ? 18 : 35; x < 400; x += 34) {
      ctx.beginPath(); ctx.arc(x * u, y * u * (H / W) * (400 / 300), 3.2 * u, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.13)'; ctx.fill();
    }
    // label
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 ${34 * u}px Fredoka, system-ui, sans-serif`; ctx.fillText('Scratch here', W / 2, H / 2 - 12 * u);
    ctx.font = `700 ${15 * u}px Nunito, system-ui, sans-serif`; ctx.globalAlpha = .85; ctx.fillText('to reveal your reward', W / 2, H / 2 + 22 * u); ctx.globalAlpha = 1;
    // coin icon
    ctx.beginPath(); ctx.arc(W / 2, H / 2 - 64 * u, 16 * u, 0, 7); ctx.fillStyle = '#ffc23d'; ctx.fill();
    ctx.fillStyle = '#7d1048'; ctx.font = `700 ${17 * u}px Fredoka, sans-serif`; ctx.fillText('₹', W / 2, H / 2 - 63 * u);
  }

  function pos(e) { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) * dpr, y: (e.clientY - r.top) * dpr}; }
  function scratch(p) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 46 * dpr;
    ctx.beginPath(); ctx.moveTo((last || p).x, (last || p).y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x, p.y, 23 * dpr, 0, 7); ctx.fill();
    last = p;
    if (++checks % 6 === 0) check();
  }
  function check() {
    const d = ctx.getImageData(0, 0, cv.width, cv.height).data; let clear = 0, n = 0;
    for (let i = 3; i < d.length; i += 4 * 16) { n++; if (d[i] === 0) clear++; }
    if (clear / n > 0.45) reveal();
  }
  function reveal() {
    if (done) return; done = true;
    cv.classList.add('gone'); hint.textContent = 'Congratulations, you won ₹10!'; again.hidden = false;
    burst.innerHTML = Array.from({length: 26}, (_, i) => {
      const a = (i / 26) * Math.PI * 2, d = 110 + (i % 5) * 22, c = ['#b5175e', '#2f9e5b', '#fff', '#ff6b9a', '#7d1048'][i % 5];
      return `<i style="background:${c};--x:calc(-50% + ${Math.round(Math.cos(a) * d)}px);--y:calc(-50% + ${Math.round(Math.sin(a) * d)}px);--r:${i * 47}deg;animation-delay:${(i % 4) * 30}ms"></i>`;
    }).join('');
  }
  function reset() { done = false; checks = 0; last = null; burst.innerHTML = ''; cv.classList.remove('gone'); again.hidden = true; hint.textContent = 'Drag your finger or mouse across the card.'; paintFoil(); }

  cv.addEventListener('pointerdown', (e) => { if (done) return; down = true; last = null; cv.setPointerCapture(e.pointerId); scratch(pos(e)); });
  cv.addEventListener('pointermove', (e) => { if (down && !done) scratch(pos(e)); });
  const up = () => { if (down) { down = false; last = null; if (!done) check(); } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  again.addEventListener('click', reset);
  const ro = new ResizeObserver(() => { if (!done) paintFoil(); }); ro.observe(card);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { if (!done) paintFoil(); });
}
</script>
</body>
</html>
